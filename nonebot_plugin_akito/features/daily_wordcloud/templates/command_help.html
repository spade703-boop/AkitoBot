<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=900, initial-scale=1">
<title>群聊词云指令</title>
<style>
  :root {
    --warm: #ff9750;
    --cool: #6faeff;
    --text: #fff8ef;
    --muted: rgba(255, 248, 239, 0.64);
    --line: rgba(255, 255, 255, 0.11);
    --surface: rgba(255, 255, 255, 0.06);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    width: 900px;
    font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
    color: var(--text);
    background:
      radial-gradient(760px 480px at 0% 0%, rgba(255, 145, 77, 0.21), transparent 62%),
      radial-gradient(760px 520px at 100% 100%, rgba(101, 165, 255, 0.18), transparent 64%),
      linear-gradient(155deg, #19161e 0%, #151a24 55%, #11171e 100%);
    -webkit-font-smoothing: antialiased;
  }
  .page { width: 900px; padding: 34px 38px 30px; }
  .eyebrow { font-size: 12px; font-weight: 800; letter-spacing: .19em; color: var(--muted); }
  h1 { margin: 8px 0 0; font-size: 34px; line-height: 1.1; }
  .intro { margin-top: 12px; color: var(--muted); font-size: 13px; line-height: 1.6; }
  .rule { height: 1px; margin: 20px 0; background: linear-gradient(90deg, rgba(255,151,80,.5), rgba(255,255,255,.06), rgba(111,174,255,.48)); }
  .commands { display: grid; gap: 10px; }
  .command { display: grid; grid-template-columns: 330px minmax(0, 1fr); align-items: center; gap: 18px; padding: 13px 16px; border: 1px solid var(--line); border-radius: 15px; background: var(--surface); }
  .name { color: #fff2e4; font-size: 15px; font-weight: 850; overflow-wrap: anywhere; }
  .description { color: var(--muted); font-size: 12px; line-height: 1.5; }
  .footer { display: flex; justify-content: space-between; margin-top: 19px; color: rgba(255,255,255,.38); font-size: 11px; }
</style>
</head>
<body>
<main class="page">
  <div class="eyebrow">AKITOBOT · DAILY CHAT</div>
  <h1>群聊词云指令</h1>
  <div class="intro">实时词云对目标群成员开放，同群共享 30 分钟冷却；回填、重算、屏蔽词/用户和测试等管理指令仅限超管。词云最多展示 {{ max_words }} 个高频词，所有已注册 Bot 指令会自动排除。</div>
  <div class="rule"></div>
  <section class="commands">
    {% for item in items %}
    <article class="command">
      <div class="name">{{ item.command }}</div>
      <div class="description">{{ item.description }}</div>
    </article>
    {% endfor %}
  </section>
  <footer class="footer"><span>历史回填来源：impression_history.db</span><span>AkitoBot · 群聊日报</span></footer>
</main>
</body>
</html>
